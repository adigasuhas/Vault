# Fly.io: `npm run setup` → Fly.io sets the app name and prints the commands.
# Builds from the Dockerfile; the container applies migrations on start.
app = "vault-app"
primary_region = "bom"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"
  TRUST_PROXY = "1"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "40s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
